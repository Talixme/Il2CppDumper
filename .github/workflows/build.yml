name: Build Il2CppDumper

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet publish Il2CppDumper/Il2CppDumper.csproj -c Release -r win-x64 --self-contained true -o ./publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Il2CppDumper-Custom
        path: ./publish/*
